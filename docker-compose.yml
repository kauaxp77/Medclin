version: '3.8'

services:
  app:
    build: .
    ports:
      - "80:80"
    volumes:
      - ./medclin_projeto:/var/www/html
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=
      - DB_NAME=medclin
    depends_on:
      - db

  db:
    image: mysql:5.7
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=medclin
    volumes:
      - ./medclin_projeto/backend/db/medclin.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql

volumes:
  db_data:
